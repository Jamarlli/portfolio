<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clawd · escenas</title>
<style>
  :root { color-scheme: dark; --fondo: #17141a; --panel: #231f29; --borde: #3a3342; --texto: #ece6e0; --tenue: #a79eb0; --naranja: #d77757; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, sans-serif; padding: 24px 16px 48px; }
  header { max-width: 1280px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  h1 span { color: var(--naranja); }
  .opciones { display: flex; gap: 16px; color: var(--tenue); font-size: 14px; }
  label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  input { accent-color: var(--naranja); }
  main { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 18px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
  .tarjeta:hover { border-color: var(--naranja); transform: translateY(-2px); }
  .tarjeta canvas { display: block; width: 100%; aspect-ratio: 128 / 78; image-rendering: pixelated; background: #000; }
  .pie { padding: 12px 14px 14px; }
  .pie h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  .pie p { margin: 0; color: var(--tenue); font-size: 13px; }
  .pie small { color: var(--naranja); font-size: 12px; }
  .pie b { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 9px; margin-left: 4px; }
  .pie b.v1 { background: #3a3342; color: var(--tenue); }
  .pie b.v2 { background: var(--naranja); color: #1b1410; }
  .grande { position: fixed; inset: 0; z-index: 10; background: rgba(10, 8, 12, .92); display: none; align-items: center; justify-content: center; padding: 16px; cursor: pointer; }
  .grande.on { display: flex; }
  .grande canvas { width: min(100%, 1100px); aspect-ratio: 128 / 78; image-rendering: pixelated; border: 1px solid var(--borde); border-radius: 8px; background: #000; }
  .grande span { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--tenue); font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>Clawd · <span>escenas</span></h1>
    <div class="opciones">
      <label><input id="lluvia" type="checkbox"> Lluvia (café)</label>
      <label><input id="en" type="checkbox"> Inglés</label>
    </div>
  </header>
  <main id="rejilla"></main>
  <div class="grande" id="grande"><canvas width="128" height="78"></canvas><span>Pulsa en cualquier sitio para volver</span></div>
<script type="module">
import { ESCENAS, pintar } from './clawd.js';
const INFO = {
  saludo: ['Saludo', 'Se alegra de verte: salta tres veces y te dice hola.'],
  dormir: ['Dormir', 'En la cama con su gorrito de dormir, con luna y estrellas.'],
  trabajar: ['Trabajar', 'El GIF de Claude trabajando, celda a celda: se gira, saca el portátil y teclea.'],
  halloween: ['Halloween', 'Se pinta una cara de calabaza, le sale el rabito y se enciende por dentro.'],
  hispanidad: ['12 de octubre', 'Se pinta de rojo, amarillo y rojo con un pincel y lo celebra.'],
  rugby: ['Rugby', 'Coge carrerilla, patea el balón y lo mete entre los palos.'],
  belen: ['Belén', 'La Virgen, San José, el niño, la mula y el buey; Clawd es el ángel sobre el tejado.'],
  reyes: ['Reyes Magos', 'Rey Mago con su camello: sigue la estrella y deja su regalo al niño.'],
  cupido: ['San Valentín', 'Vestido de Cupido, flecha corazones con su arco.'],
  cumple: ['Cumpleaños', 'Con su gorrito, sopla las velas de la tarta y llueve confeti.'],
  fallas: ['Fallas', 'Con peinado de fallera, mira cómo arde una falla.'],
  musica: ['Música', 'Con unos cascos azules, escucha música, asiente al ritmo y suelta notas.'],
  cafe: ['Café', 'Se toma un café calentito y se pone contento.'],
  nieve: ['Nieve', 'Con bufanda y gorro de lana, hace un muñeco de nieve.'],
  pascua: ['Pascua', 'Disfrazado de conejito, busca huevos de Pascua y los encuentra.'],
  noel: ['Papá Noel', 'En trineo con su saco, aterriza en el tejado y se cuela por la chimenea.'],
};
const ctxEscena = () => ({ llueve: document.getElementById('lluvia').checked, en: document.getElementById('en').checked });
const rejilla = document.getElementById('rejilla'), grande = document.getElementById('grande'), cvGrande = grande.querySelector('canvas'), ctxGrande = cvGrande.getContext('2d');
const tarjetas = [];
const ORDEN = Object.keys(INFO).flatMap(k => (ESCENAS[k + '2'] && k !== 'trabajar') ? [k, k + '2'] : [k]);
for (const k of ORDEN) {
  const base = k.replace(/2$/, ''), v2 = k !== base;
  const art = document.createElement('article'); art.className = 'tarjeta';
  art.innerHTML = `<canvas width="128" height="78"></canvas><div class="pie"><h2>${INFO[base][0]} ${v2 ? '<b class="v2">versión 2</b>' : (ESCENAS[base + '2'] && base !== 'trabajar' ? '<b class="v1">versión 1</b>' : '')} <small>${ESCENAS[k].dur} s</small></h2><p>${INFO[base][1]}</p></div>`;
  const cv = art.querySelector('canvas'), t = { k, cv, ctx: cv.getContext('2d'), visible: true, t0: null };
  new IntersectionObserver(es => { t.visible = es[0].isIntersecting; }).observe(art);
  art.onclick = () => { grande.on = k; grande.classList.add('on'); grande.t0 = null; };
  rejilla.append(art); tarjetas.push(t);
}
grande.onclick = () => { grande.on = null; grande.classList.remove('on'); };
addEventListener('keydown', e => { if (e.key === 'Escape') grande.onclick(); });
let ultimo = -1e9;
function bucle(now) {
  requestAnimationFrame(bucle);
  if (now - ultimo < 80) return;                                   // 12 imágenes por segundo, como en el cuarto
  ultimo = now; const c = ctxEscena();
  for (const t of tarjetas) {
    if (!t.visible) continue;
    t.t0 ??= now;
    pintar(t.ctx, t.k, ((now - t.t0) / 1000) % ESCENAS[t.k].dur, c);
  }
  if (grande.on) { grande.t0 ??= now; pintar(ctxGrande, grande.on, ((now - grande.t0) / 1000) % ESCENAS[grande.on].dur, c); }
}
requestAnimationFrame(bucle);
</script>
</body>
</html>
